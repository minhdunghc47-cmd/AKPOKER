<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACEPOKER TV DISPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Oswald:wght@200..700&display=swap');
        @font-face {
            font-family: 'Mafia';
            src: local('Impact');
        }
        @font-face {
            font-family: 'Digital';
            src: url('https://fonts.cdnfonts.com/s/17260/DS-DIGI.woff') format('woff');
        }
        
        body { background-color: #050b14; color: #ffffff; font-family: 'Oswald', sans-serif; overflow: hidden; }
        .font-mafia { font-family: 'Mafia', sans-serif; letter-spacing: 2px; }
        .font-digital { font-family: 'Digital', monospace; }
        .font-teko { font-family: 'Teko', sans-serif; }
        
        .pulse-clock { animation: pulseDanger 1s infinite alternate; }
        @keyframes pulseDanger {
            from { text-shadow: 0 0 20px rgba(255,0,0,0.5); transform: scale(1); }
            to { text-shadow: 0 0 50px rgba(255,0,0,1); transform: scale(1.02); }
        }

        .flash-danger { animation: flashRed 1s 3; }
        @keyframes flashRed {
            0% { box-shadow: inset 0 0 0px transparent; }
            50% { box-shadow: inset 0 0 150px rgba(255,0,0,0.8); }
            100% { box-shadow: inset 0 0 0px transparent; }
        }

        .gradient-text { background: linear-gradient(to bottom, #fff, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Stats Box styling */
        .stat-box { border-bottom: 1px solid rgba(212,175,55,0.2); padding: 1.2rem 0; display: flex; justify-content: space-between; align-items: baseline; }
        .stat-box:last-child { border-bottom: none; }
        .stat-title { font-size: clamp(1rem, 1.2vw, 1.8rem); color: #8892b0; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
        .stat-val { font-size: clamp(1.8rem, 2.5vw, 3.5rem); font-family: 'Teko', sans-serif; font-weight: 600; color: #d4af37; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="flex flex-col h-screen w-screen selection:bg-none" id="tv-body">

<audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<!-- SETUP MENU -->
<div id="setup-menu" class="absolute inset-0 z-50 bg-[#050b14] flex flex-col items-center justify-center">
    <div class="bg-[#111827] border border-[#d4af37]/40 rounded-2xl p-10 w-[600px] shadow-2xl text-center">
        <h1 class="font-mafia text-5xl text-[#d4af37] mb-8">ACEPOKER TV CONTROL</h1>
        <select id="tour-select" class="w-full bg-[#1f2937] text-white p-5 rounded-lg border border-[#374151] font-bold text-xl outline-none focus:border-[#d4af37] mb-8 uppercase tracking-widest text-center appearance-none cursor-pointer"></select>
        <button class="w-full bg-gradient-to-r from-[#d4af37] to-[#aa801e] text-black font-mafia text-3xl py-5 rounded-lg uppercase hover:scale-105 transition shadow-[0_0_30px_rgba(212,175,55,0.4)]" onclick="startBroadcast()">PHÁT SÓNG LÊN TIVI</button>
    </div>
</div>

<!-- MAIN TV UI (3 COLUMNS) -->
<div id="main-tv" class="hidden flex-col h-full w-full">
    
    <!-- HEADER -->
    <div class="h-[12vh] bg-gradient-to-b from-[#0a1128] to-[#050b14] border-b border-[#d4af37]/30 flex justify-between items-center px-10 shadow-[0_5px_30px_rgba(0,0,0,0.8)] z-10 shrink-0">
        <div class="flex items-center gap-4 w-[25%]">
            <div class="w-16 h-16 rounded-full bg-black border-2 border-[#d4af37] flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.5)]">
                <i class="fa-solid fa-crown text-3xl text-[#d4af37]"></i>
            </div>
            <div class="font-mafia text-4xl text-white tracking-widest leading-none">ACE<span class="text-[#d4af37]">POKER</span></div>
        </div>
        
        <div class="flex-1 text-center">
            <h1 id="tv-tour-name" class="font-mafia text-5xl md:text-6xl text-white uppercase tracking-widest drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]">TOURNAMENT NAME</h1>
        </div>
        
        <div class="w-[25%] flex justify-end items-center text-right text-[#d4af37] text-2xl font-teko">
            <span id="tv-realtime" class="tracking-widest">00:00:00</span>
        </div>
    </div>

    <!-- 3 COLUMNS -->
    <div class="flex-1 flex overflow-hidden w-full">
        
        <!-- LEFT COL: STATS -->
        <div class="w-[23%] bg-[#081020]/80 border-r border-[#d4af37]/20 flex flex-col p-8 justify-between z-0">
            <div>
                <div class="stat-box mt-2">
                    <span class="stat-title">REG. CLOSES</span>
                    <span class="stat-val text-white" id="tv-late-reg">Lvl 8</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">PLAYERS (ALIVE)</span>
                    <span class="stat-val text-emerald-400"><span id="tv-alive">0</span> <span class="text-gray-500 text-3xl">/ <span id="tv-entries">0</span></span></span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">STARTING STACK</span>
                    <span class="stat-val" id="tv-start-stack">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-title">TOTAL CHIPS</span>
                    <span class="stat-val" id="tv-total-chips">0</span>
                </div>
                <div class="stat-box border-none mt-4">
                    <div class="flex flex-col w-full">
                        <span class="stat-title text-center mb-1">AVERAGE STACK</span>
                        <div class="flex justify-center items-end gap-3">
                            <span class="stat-val text-blue-400 text-[clamp(3rem,3.5vw,4.5rem)]" id="tv-avg">0</span>
                            <span class="text-[#d4af37] font-bold text-[clamp(1.5rem,1.8vw,2rem)] bg-[#d4af37]/10 px-3 py-1 rounded-lg border border-[#d4af37]/30 mb-2 shadow-sm" id="tv-avg-bb">0 BB</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center text-gray-600 text-[clamp(0.8rem,1vw,1.2rem)] tracking-widest border-t border-gray-800 pt-4 font-bold">
                TABLES ACTIVE: <span class="text-white ml-2" id="tv-tables"></span>
            </div>
        </div>

        <!-- CENTER COL: CLOCK -->
        <div class="w-[45%] min-w-0 overflow-hidden bg-gradient-to-b from-[#0f172a] to-[#050b14] flex flex-col justify-center items-center relative shadow-[0_0_50px_rgba(0,0,0,0.5)] z-20 border-x-4 border-black">
            
            <div class="absolute top-8 w-full text-center">
                <div class="font-mafia text-[clamp(3rem,4vw,5rem)] tracking-widest text-[#d4af37] drop-shadow-[0_0_20px_rgba(212,175,55,0.4)]" id="tv-level-name">LEVEL 1</div>
            </div>

            <!-- CLOCK -->
            <div class="w-full flex justify-center items-center my-8 mt-24">
                <div id="tv-clock" class="font-digital text-[clamp(6rem,15vw,16rem)] leading-none tracking-tighter whitespace-nowrap text-white drop-shadow-[0_0_30px_rgba(255,255,255,0.3)]">00:00</div>
            </div>

            <!-- BLINDS -->
            <div class="w-full text-center mb-12">
                <div class="text-gray-400 text-2xl font-bold tracking-widest uppercase mb-2">BLINDS</div>
                <div class="font-teko text-[clamp(4rem,7vw,7rem)] leading-none text-emerald-400 font-bold whitespace-nowrap drop-shadow-[0_5px_15px_rgba(0,0,0,0.5)]" id="tv-blinds">1K / 2K</div>
                <div class="font-teko text-[3rem] text-[#d4af37] mt-2 font-bold tracking-widest uppercase bg-[#d4af37]/10 inline-block px-8 py-1 rounded border border-[#d4af37]/30" id="tv-ante">BBA 2K</div>
            </div>

            <div class="absolute bottom-0 w-full flex text-center bg-black/80 border-t border-[#333] h-[10vh]">
                <div class="flex-1 flex flex-col justify-center border-r border-[#333]">
                    <div class="text-gray-500 text-[clamp(0.7rem,0.9vw,1rem)] font-bold tracking-widest uppercase">NEXT BREAK</div>
                    <div class="text-[#ff4c4c] font-bold text-[clamp(1.5rem,1.8vw,2.5rem)] tracking-widest" id="tv-next-break">—</div>
                </div>
                <div class="flex-[1.5] flex flex-col justify-center">
                    <div class="text-gray-500 text-[clamp(0.7rem,0.9vw,1rem)] font-bold tracking-widest uppercase">NEXT LEVEL</div>
                    <div class="text-blue-400 font-bold text-[clamp(2rem,2.5vw,3.5rem)] font-teko tracking-wider" id="tv-next-level">2K / 4K - 4K</div>
                </div>
            </div>
        </div>

        <!-- RIGHT COL: DYNAMIC PRIZE/WATERMARK -->
        <div class="w-[32%] bg-[#081020]/80 border-l border-[#d4af37]/20 flex flex-col relative z-0">
            
            <!-- WATERMARK VIEW (Before Late Reg closes) -->
            <div id="tv-late-reg-view" class="absolute inset-0 flex flex-col items-center justify-center opacity-60">
                <i class="fa-solid fa-crown text-[12rem] text-[#d4af37] opacity-20 mb-10"></i>
                <div class="font-mafia text-5xl text-gray-500 tracking-widest text-center">LATE REG<br><span class="text-[#d4af37]">OPEN</span></div>
                <div class="mt-4 border border-[#d4af37]/50 bg-[#d4af37]/10 text-[#d4af37] px-6 py-2 rounded-full font-bold uppercase tracking-widest text-sm">
                    ĐANG MỞ ĐĂNG KÝ
                </div>
                <div class="text-[clamp(1.5rem,2vw,2.5rem)] font-bold text-yellow-400 mt-4 animate-pulse drop-shadow-[0_0_10px_rgba(234,179,8,0.6)]" id="tv-late-reg-countdown"></div>
            </div>

            <!-- PAYOUT VIEW (After Late Reg closes) -->
            <div id="tv-payout-view" class="absolute inset-0 flex flex-col hidden p-6">
                <div class="text-center mb-6 border-b border-[#333] pb-6">
                    <div class="text-gray-400 font-bold tracking-widest uppercase text-[clamp(1rem,1.2vw,1.5rem)] mb-2">PRIZE POOL</div>
                    <div class="font-teko text-[clamp(4rem,4.5vw,6rem)] text-gold text-[#d4af37] drop-shadow-[0_0_15px_rgba(212,175,55,0.4)] font-bold" id="tv-prize-pool">0 ₫</div>
                </div>
                
                <div class="flex-1 overflow-hidden flex flex-col">
                    <div class="text-center text-gray-500 font-bold tracking-widest text-[clamp(0.8rem,1vw,1.2rem)] mb-4">PAYOUTS (TOP ITM)</div>
                    <div class="flex-1 overflow-y-auto space-y-3 pr-2" id="tv-payout-list">
                        <!-- Payouts injected here -->
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io('https://akpoker.onrender.com');
    let currentTours = [];
    let broadcastTourId = null;
    let realtimeInterval = null;

    function formatMoney(n) { 
        if(!n) return '0';
        return new Intl.NumberFormat('vi-VN').format(n); 
    }
    
    function formatMoneyShort(n) {
        if(!n) return '0';
        if(n >= 1000000) return (n/1000000).toFixed(n%1000000 === 0 ? 0 : 1) + 'M';
        if(n >= 1000) return (n/1000).toFixed(n%1000 === 0 ? 0 : 1) + 'K';
        return n.toString();
    }

    function formatTime(sec) {
        if(sec < 0) sec = 0;
        const m = Math.floor(sec/60).toString().padStart(2,'0');
        const s = (sec%60).toString().padStart(2,'0');
        return `${m}:${s}`;
    }

    // Real time clock
    function startRealTime() {
        if(realtimeInterval) clearInterval(realtimeInterval);
        realtimeInterval = setInterval(() => {
            const now = new Date();
            const hh = now.getHours().toString().padStart(2,'0');
            const mm = now.getMinutes().toString().padStart(2,'0');
            const ss = now.getSeconds().toString().padStart(2,'0');
            const el = document.getElementById('tv-realtime');
            if(el) el.innerText = `${hh}:${mm}:${ss}`;
        }, 1000);
    }

    socket.on('connect', () => { socket.emit('request_initial_data'); });

    socket.on('update_tours', (tours) => {
        currentTours = tours;
        if (!broadcastTourId) {
            const select = document.getElementById('tour-select');
            const prev = select.value;
            select.innerHTML = '<option value="">— Chọn Giải Đấu Để Phát Sóng —</option>';
            tours.filter(t => t.status !== 'archived').forEach(tour => {
                const opt = document.createElement('option');
                opt.value = tour.id;
                opt.innerText = `[${tour.status.toUpperCase()}] ${tour.name}`;
                if(tour.id === prev) opt.selected = true;
                select.appendChild(opt);
            });
        } else {
            renderMainTV();
        }
    });

    function startBroadcast() {
        const val = document.getElementById('tour-select').value;
        if(!val) return alert('Vui lòng chọn giải đấu!');
        document.getElementById('alert-sound').load();
        broadcastTourId = val;
        document.getElementById('setup-menu').classList.add('hidden');
        document.getElementById('main-tv').classList.remove('hidden');
        document.getElementById('main-tv').classList.add('flex');
        startRealTime();
        renderMainTV();
        document.documentElement.requestFullscreen?.().catch(()=>{});
    }

    function renderMainTV() {
        if(!broadcastTourId) return;
        const tour = currentTours.find(t => t.id === broadcastTourId);
        
        if(!tour || tour.status === 'archived') {
            document.getElementById('main-tv').classList.add('hidden');
            document.getElementById('main-tv').classList.remove('flex');
            document.getElementById('setup-menu').classList.remove('hidden');
            if (window.realtimeInterval) clearInterval(window.realtimeInterval);
            return;
        }


        // Header
        document.getElementById('tv-tour-name').innerText = tour.name;

        // Left Col Stats
        const lateRegLvlNum = tour.settings?.late_reg_level || 8;
        document.getElementById('tv-late-reg').innerText = `Lvl ${lateRegLvlNum}`;
        
        const alive = (tour.players || []).filter(p => p.status === 'alive').length;
        document.getElementById('tv-alive').innerText = alive;
        document.getElementById('tv-entries').innerText = tour.entries;
        document.getElementById('tv-start-stack').innerText = formatMoney(tour.starting_stack);
        
        const totalChips = tour.entries * tour.starting_stack;
        document.getElementById('tv-total-chips').innerText = formatMoney(totalChips);
        
        const avg = alive > 0 ? Math.floor(totalChips / alive) : 0;
        document.getElementById('tv-avg').innerText = formatMoney(avg);
        
        document.getElementById('tv-tables').innerText = (tour.tables || []).join(', ') || '—';

        // Current blind
        const blind = tour.blinds_structure[tour.current_level_idx];
        const isBreak = blind?.is_break;
        const currentLvlNum = isBreak ? (tour.blinds_structure[tour.current_level_idx - 1]?.level || 1) : blind?.level;

        // BB Calc
        const bbAmount = isBreak ? (tour.blinds_structure[tour.current_level_idx - 1]?.bb || 1) : blind?.bb || 1;
        const bbCount = avg > 0 ? Math.floor(avg / bbAmount) : 0;
        document.getElementById('tv-avg-bb').innerText = `${bbCount} BB`;

        document.getElementById('tv-level-name').innerText = isBreak ? 'BREAK TIME' : `LEVEL ${blind?.level || 0}`;

        // Clock
        const clockEl = document.getElementById('tv-clock');
        clockEl.innerText = formatTime(tour.time_remaining);
        const danger = tour.time_remaining <= 60 && !isBreak && tour.status === 'running';
        if(danger) {
            clockEl.style.color = '#ff2a4b';
            clockEl.style.textShadow = '0 0 40px rgba(255,0,50,0.9)';
            clockEl.classList.add('pulse-clock');
        } else if(isBreak) {
            clockEl.style.color = '#ff4c4c';
            clockEl.style.textShadow = '0 0 30px rgba(255,76,76,0.6)';
            clockEl.classList.remove('pulse-clock');
        } else {
            clockEl.style.color = '#ffffff';
            clockEl.style.textShadow = '0 0 30px rgba(255,255,255,0.4)';
            clockEl.classList.remove('pulse-clock');
        }

        // Blinds info
        if(isBreak) {
            document.getElementById('tv-blinds').innerText = 'BREAK';
            document.getElementById('tv-blinds').classList.replace('text-emerald-400', 'text-[#ff4c4c]');
            document.getElementById('tv-ante').innerText = 'RELAX';
        } else {
            document.getElementById('tv-blinds').innerText = `${formatMoneyShort(blind?.sb)} / ${formatMoneyShort(blind?.bb)}`;
            document.getElementById('tv-blinds').classList.replace('text-[#ff4c4c]', 'text-emerald-400');
            document.getElementById('tv-ante').innerText = `BBA ${formatMoneyShort(blind?.ante)}`;
        }

        // Next level / Next Break
        const nextBlind = tour.blinds_structure[tour.current_level_idx + 1];
        if (nextBlind) {
            if (nextBlind.is_break) {
                document.getElementById('tv-next-level').innerText = 'BREAK';
            } else {
                document.getElementById('tv-next-level').innerText = `${formatMoneyShort(nextBlind.sb)}/${formatMoneyShort(nextBlind.bb)} - ${formatMoneyShort(nextBlind.ante)}`;
            }
        } else {
            document.getElementById('tv-next-level').innerText = 'FINAL';
        }

        let nextBreakStr = '—';
        for (let i = tour.current_level_idx + 1; i < tour.blinds_structure.length; i++) {
            if (tour.blinds_structure[i].is_break) {
                nextBreakStr = `AFTER LVL ${tour.blinds_structure[i-1]?.level || '?'}`;
                break;
            }
        }
        document.getElementById('tv-next-break').innerText = nextBreakStr;

        // Dynamic Right Column (Late Reg vs Payouts)
        
        const isLateRegClosed = (currentLvlNum >= lateRegLvlNum) || tour.status === 'finished';
        
        // --- LATE REG COUNTDOWN LOGIC ---
        if (!isLateRegClosed) {
            let totalRemainingSec = tour.time_remaining || 0;
            for (let i = tour.current_level_idx + 1; i < tour.blinds_structure.length; i++) {
                const b = tour.blinds_structure[i];
                if (!b.is_break && b.level >= lateRegLvlNum) {
                    break;
                }
                totalRemainingSec += (Number(b.duration_minutes) || 0) * 60;
            }
            
            let hr = Math.floor(totalRemainingSec / 3600);
            let min = Math.floor((totalRemainingSec % 3600) / 60);
            let sec = totalRemainingSec % 60;
            let formattedLateReg = '';
            
            if (hr > 0) {
                formattedLateReg = hr.toString().padStart(2, '0') + ':' + min.toString().padStart(2, '0') + ':' + sec.toString().padStart(2, '0');
            } else {
                formattedLateReg = min.toString().padStart(2, '0') + ':' + sec.toString().padStart(2, '0');
            }
            
            const countdownEl = document.getElementById('tv-late-reg-countdown');
            if (countdownEl) countdownEl.innerText = 'ĐÓNG SAU: ' + formattedLateReg;
        }
        // --------------------------------

        const viewLateReg = document.getElementById('tv-late-reg-view');
        const viewPayout = document.getElementById('tv-payout-view');

        if (isLateRegClosed) {
            viewLateReg.classList.add('hidden');
            viewPayout.classList.remove('hidden');

            const pool = tour.fund.payout_pool || (tour.fund.total_paid * 0.85);
            document.getElementById('tv-prize-pool').innerText = formatMoney(pool) + ' ₫';

            // Mock or actual payouts
            // If the system doesn't have explicit payouts yet, render a mock top 3 or generated list based on ITM
            const payoutListEl = document.getElementById('tv-payout-list');
            payoutListEl.innerHTML = '';
            
            // Generate smart ITM payouts
            let payoutsToRender = [];
            const e = tour.entries || 0;
            if (pool > 0) {
                if (e <= 5) {
                    payoutsToRender = [{ rank: 1, amount: pool }];
                } else if (e <= 10) {
                    payoutsToRender = [{ rank: 1, amount: pool * 0.65 }, { rank: 2, amount: pool * 0.35 }];
                } else if (e <= 20) {
                    payoutsToRender = [{ rank: 1, amount: pool * 0.50 }, { rank: 2, amount: pool * 0.30 }, { rank: 3, amount: pool * 0.20 }];
                } else if (e <= 40) {
                    payoutsToRender = [{ rank: 1, amount: pool * 0.45 }, { rank: 2, amount: pool * 0.25 }, { rank: 3, amount: pool * 0.15 }, { rank: 4, amount: pool * 0.10 }, { rank: 5, amount: pool * 0.05 }];
                } else {
                    payoutsToRender = [{ rank: 1, amount: pool * 0.40 }, { rank: 2, amount: pool * 0.25 }, { rank: 3, amount: pool * 0.15 }, { rank: 4, amount: pool * 0.10 }, { rank: 5, amount: pool * 0.06 }, { rank: 6, amount: pool * 0.04 }];
                }
            }

            if (payoutsToRender.length > 0) {
                payoutsToRender.forEach(p => {
                    const bustedName = tour.itm_results ? tour.itm_results[p.rank] : null;
                    const row = document.createElement('div');
                    
                    const isTop1 = p.rank === 1;
                    
                    // Base styles
                    const containerStyle = isTop1
                        ? 'flex items-center w-full px-4 py-4 bg-gradient-to-r from-yellow-500/30 to-[#111] border border-yellow-500 rounded shadow-[0_0_30px_rgba(234,179,8,0.4)] my-2'
                        : (bustedName 
                            ? 'flex items-center w-full px-4 py-3 bg-gradient-to-r from-[#d4af37]/20 to-[#111] border border-[#d4af37]/50 rounded shadow-[0_0_15px_rgba(212,175,55,0.2)]'
                            : 'flex items-center w-full px-4 py-3 bg-[#111] border border-[#333] rounded shadow-[0_0_15px_rgba(16,185,129,0.1)]');
                    
                    const rankStyle = isTop1
                        ? 'w-16 shrink-0 text-center flex justify-center items-center font-mafia text-3xl text-yellow-400 bg-black/50 rounded p-1 shadow-[inset_0_0_15px_rgba(212,175,55,0.4)]'
                        : 'w-16 shrink-0 text-center flex justify-center items-center font-mafia text-2xl text-white bg-black rounded p-1 shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]';
                        
                    const rankContent = isTop1 ? '<i class="fa-solid fa-trophy mr-1 text-xl"></i>1' : '#' + p.rank;
                    
                    const nameStyle = isTop1
                        ? 'flex-1 min-w-0 mx-4 text-left truncate px-2 font-bold text-yellow-400 text-lg md:text-xl uppercase tracking-tight drop-shadow-[0_0_8px_rgba(234,179,8,0.8)]'
                        : 'flex-1 min-w-0 mx-4 text-left truncate px-2 font-bold text-white text-sm md:text-base uppercase tracking-tight drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]';
                        
                    const amountStyle = isTop1
                        ? 'whitespace-nowrap shrink-0 text-right font-teko text-4xl text-yellow-400 font-bold tracking-tighter drop-shadow-[0_0_15px_rgba(212,175,55,0.8)] leading-none'
                        : 'whitespace-nowrap shrink-0 text-right font-teko text-2xl md:text-3xl text-emerald-400 font-bold tracking-tighter leading-none';
                        
                    const amountSymbolStyle = isTop1 ? 'text-xl' : 'text-lg';

                    row.className = containerStyle;
                    
                    let nameHtml = '';
                    if (bustedName) {
                        nameHtml = `<div class="${nameStyle}" style="flex: 1 1 0%; min-width: 0;">${bustedName}</div>`;
                    } else {
                        nameHtml = `<div class="mx-4 border-b-2 border-dashed border-[#333] opacity-70" style="flex: 1 1 0%; min-width: 0;"></div>`;
                    }
                    
                    row.innerHTML = `
                        <div class="${rankStyle}" style="flex-shrink: 0;">${rankContent}</div>
                        ${nameHtml}
                        <div class="${amountStyle}" style="flex-shrink: 0;">${formatMoney(p.amount)} <span class="${amountSymbolStyle}">₫</span></div>
                    `;
                    
                    payoutListEl.appendChild(row);
                });
            } else {
                payoutListEl.innerHTML = '<div class="text-center text-gray-600 mt-10 font-bold text-sm">CHƯA CÓ THÔNG TIN TRẢ THƯỞNG</div>';
            }

        } else {
            viewLateReg.classList.remove('hidden');
            viewPayout.classList.add('hidden');
        }
    }

    socket.on('level_changed', (data) => {
        if(data.tour_id === broadcastTourId) {
            const audio = document.getElementById('alert-sound');
            audio.currentTime = 0;
            audio.play().catch(()=>{});
            const body = document.getElementById('tv-body');
            body.classList.remove('flash-danger');
            void body.offsetWidth;
            body.classList.add('flash-danger');
        }
    });
</script>
</body>
</html>
