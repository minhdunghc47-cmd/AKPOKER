<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const role = sessionStorage.getItem('acepoker_role');
        if (role !== 'floor' && role !== 'god') {
            window.location.href = './index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEPOKER - Floor (Mafia Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #d1d5db; -webkit-tap-highlight-color: transparent; }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .text-gold { color: #d4af37; }
        
        .seat { 
            width: 70px; height: 70px; 
            border-radius: 50%; 
            background: #161616; 
            border: 2px solid #333; 
            position: absolute; 
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: all 0.2s;
        }
        .seat.occupied { border-color: #d4af37; background: #1a1a1a; }
        .seat.empty { border-style: dashed; opacity: 0.5; }
        .seat:hover { transform: translate(-50%, -50%) scale(1.1); z-index: 10; }
        
        /* Popup Menu Animation */
        .action-menu {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(10px) scale(0.95);
            opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 50;
        }
        .action-menu.active {
            opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(5px) scale(1);
        }

        /* Oval Table */
        .poker-table-bg {
            background: radial-gradient(ellipse at center, #1a4a28 0%, #0d2b15 100%);
            border: 6px solid #8c6222;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.9);
            border-radius: 120px;
        }

        .btn-gold { background: linear-gradient(to bottom, #e5c158, #d4af37); color: #000; font-weight: bold; border-radius: 4px; border: 1px solid #b5952f; transition: 0.2s; }
        .btn-gold:hover { background: linear-gradient(to bottom, #d4af37, #b5952f); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- HEADER -->
    <header class="bg-[#111] border-b border-[#d4af37]/30 p-4 flex justify-between items-center shadow-lg shrink-0">
        <h1 class="text-2xl font-mafia text-gold tracking-widest"><i class="fa-solid fa-tablet-screen-button mr-2"></i> FLOOR IPAD</h1>
        <select id="tour-select" class="bg-[#1a1a1a] border border-[#d4af37]/50 text-white p-2 rounded text-sm font-bold uppercase tracking-widest focus:outline-none focus:border-[#d4af37]" onchange="renderTables()">
            <option value="">-- Chọn Giải Đấu --</option>
        </select>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 relative" id="main-content">
        <div id="no-tour-msg" class="text-center text-gray-500 font-bold uppercase tracking-widest mt-20">Vui lòng chọn giải đấu để xem sơ đồ bàn.</div>
        <div id="tables-container" class="grid grid-cols-1 xl:grid-cols-2 gap-16 pb-32 hidden"></div>
    </main>

    <!-- MODAL GÁN DEALER -->
    <div id="dealer-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#161616] border border-[#d4af37] p-6 rounded-xl w-96 shadow-[0_0_30px_rgba(212,175,55,0.3)]">
            <h3 class="text-xl font-mafia text-gold mb-4 uppercase text-center border-b border-[#333] pb-2">Gán Dealer Vào Bàn</h3>
            <input type="text" id="dealer-name" class="w-full bg-[#111] border border-[#333] p-3 rounded text-white mb-4 focus:border-[#d4af37] focus:outline-none" placeholder="Nhập tên Dealer...">
            <div class="flex gap-3">
                <button class="flex-1 bg-[#1a1a1a] text-gray-400 py-3 rounded font-bold uppercase hover:bg-[#222]" onclick="closeDealerModal()">Hủy</button>
                <button class="flex-1 btn-gold py-3 rounded font-bold uppercase" onclick="confirmAssignDealer()">Xác Nhận</button>
            </div>
        </div>
    </div>

    <!-- MODAL CHUYỂN BÀN -->
    <div id="move-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#161616] border border-[#d4af37] p-6 rounded-xl w-96 shadow-[0_0_30px_rgba(212,175,55,0.3)]">
            <h3 class="text-xl font-mafia text-gold mb-4 uppercase text-center border-b border-[#333] pb-2">Chuyển Bàn Khách Hàng</h3>
            <div class="text-white text-center mb-4 font-bold" id="move-player-name"></div>
            <label class="block text-[10px] text-gray-400 font-bold uppercase mb-2">Chọn Bàn Đích:</label>
            <select id="move-table-select" class="w-full bg-[#111] border border-[#333] p-3 rounded text-white mb-6 focus:border-[#d4af37] focus:outline-none"></select>
            <div class="flex gap-3">
                <button class="flex-1 bg-[#1a1a1a] text-gray-400 py-3 rounded font-bold uppercase hover:bg-[#222]" onclick="closeMoveModal()">Hủy</button>
                <button class="flex-1 btn-gold py-3 rounded font-bold uppercase" onclick="confirmMoveTable()">Xác Nhận</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');
        let currentTours = [];
        let globalTables = [];
        let selectedTourId = null;
        let activeMenuSeatId = null;

        let pendingDealerTableId = null;
        
        let pendingMovePhone = null;
        let pendingMoveTourId = null;

        // Tọa độ 9 ghế (X%, Y%)
        const seatPositions = [
            { id: 1, x: 82, y: 20 },
            { id: 2, x: 95, y: 50 },
            { id: 3, x: 82, y: 80 },
            { id: 4, x: 62, y: 95 },
            { id: 5, x: 50, y: 100 },
            { id: 6, x: 38, y: 95 },
            { id: 7, x: 18, y: 80 },
            { id: 8, x: 5, y: 50 },
            { id: 9, x: 18, y: 20 }
        ];

        socket.on('update_tours', (tours) => {
            currentTours = tours;
            updateTourSelect();
            if(selectedTourId) renderTables();
        });

        socket.on('update_tables', (tables) => {
            globalTables = tables;
            if(selectedTourId) renderTables();
        });

        function updateTourSelect() {
            const select = document.getElementById('tour-select');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Chọn Giải Đấu --</option>';
            currentTours.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = `${t.name} [${t.status}]`;
                if(t.id === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
            selectedTourId = select.value;
        }

        document.getElementById('tour-select').addEventListener('change', (e) => {
            selectedTourId = e.target.value;
            if(selectedTourId) {
                document.getElementById('no-tour-msg').classList.add('hidden');
                document.getElementById('tables-container').classList.remove('hidden');
                renderTables();
            } else {
                document.getElementById('no-tour-msg').classList.remove('hidden');
                document.getElementById('tables-container').classList.add('hidden');
            }
        });

        // Đóng menu khi click ra ngoài
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.seat')) {
                closeAllMenus();
            }
        });

        function closeAllMenus() {
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
            activeMenuSeatId = null;
        }

        function toggleMenu(e, seatId) {
            e.stopPropagation(); // Prevent document click
            const menu = document.getElementById(`menu-${seatId}`);
            if(activeMenuSeatId === seatId) {
                menu.classList.remove('active');
                activeMenuSeatId = null;
            } else {
                closeAllMenus();
                menu.classList.add('active');
                activeMenuSeatId = seatId;
            }
        }

        function renderTables() {
            if(!selectedTourId) return;
            const t = currentTours.find(x => x.id === selectedTourId);
            if(!t) return;
            
            const container = document.getElementById('tables-container');
            container.innerHTML = '';

            const tourTables = globalTables.filter(tbl => t.tables.includes(tbl.id));

            tourTables.forEach(tbl => {
                // Get players for this table
                const tablePlayers = t.players.filter(p => p.table_id === tbl.id && p.status === 'alive');
                
                const tableWrapper = document.createElement('div');
                tableWrapper.className = 'w-full max-w-[700px] h-[350px] mx-auto relative mt-10 mb-10';

                // Bàn Oval
                let dealerHtml = '';
                if(tbl.dealer_name) {
                    dealerHtml = `
                        <div class="text-[#d4af37] text-lg font-mafia tracking-widest bg-black/60 px-4 py-2 rounded-full border border-[#d4af37]/30 shadow-lg">
                            <i class="fa-solid fa-hands-holding-circle mr-2"></i>${tbl.dealer_name}
                        </div>
                    `;
                } else {
                    dealerHtml = `
                        <button class="bg-[#d4af37]/20 border border-[#d4af37] text-[#d4af37] px-4 py-2 rounded-full font-bold uppercase tracking-widest text-xs hover:bg-[#d4af37]/40 transition animate-pulse shadow-[0_0_15px_rgba(212,175,55,0.4)]" onclick="openDealerModal(${tbl.id})">
                            <i class="fa-solid fa-plus mr-1"></i> CHỌN DEALER
                        </button>
                    `;
                }

                tableWrapper.innerHTML = `
                    <div class="absolute inset-x-12 inset-y-8 poker-table-bg flex flex-col items-center justify-center text-center">
                        <div class="absolute top-4 text-gray-400 font-bold tracking-widest text-sm opacity-50">BÀN ${tbl.id}</div>
                        
                        <!-- Dealer Area (Top Center inside table) -->
                        <div class="absolute top-8">
                            ${dealerHtml}
                        </div>

                        <!-- Center Info -->
                        <div class="text-white/20 font-mafia text-5xl tracking-widest uppercase mt-4 pointer-events-none">MAFIA</div>
                    </div>
                `;

                // Render Seats
                seatPositions.forEach((pos, index) => {
                    const player = tablePlayers[index]; // Map player to seat index
                    
                    const seatDiv = document.createElement('div');
                    seatDiv.className = `seat ${player ? 'occupied' : 'empty'}`;
                    seatDiv.style.left = `${pos.x}%`;
                    seatDiv.style.top = `${pos.y}%`;
                    
                    if(player) {
                        const uid = `seat_${tbl.id}_${index}`;
                        seatDiv.onclick = (e) => toggleMenu(e, uid);
                        seatDiv.innerHTML = `
                            <div class="flex-1 flex flex-col items-center justify-center w-full h-full p-1">
                                <div class="text-[9px] text-[#d4af37] font-bold truncate w-full text-center">${player.phone.slice(-4)}</div>
                                <div class="text-[11px] text-white font-bold truncate w-full text-center mt-0.5">${player.name.split(' ').pop()}</div>
                            </div>
                            <!-- Popup Menu -->
                            <div id="menu-${uid}" class="action-menu bg-[#1a1a1a] border border-[#d4af37]/50 rounded-lg p-2 shadow-2xl flex flex-col gap-1 w-36">
                                <button class="w-full text-left px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-emerald-400 hover:bg-[#333] rounded" onclick="openMoveModal('${player.phone}', '${player.name}', ${tbl.id})">
                                    <i class="fa-solid fa-rotate mr-2"></i> Chuyển Bàn
                                </button>
                                <button class="w-full text-left px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-red-500 hover:bg-[#333] rounded" onclick="bustOut('${player.phone}')">
                                    <i class="fa-solid fa-skull mr-2"></i> Bust Out
                                </button>
                            </div>
                        `;
                    } else {
                        seatDiv.innerHTML = `<div class="text-gray-600 font-bold text-xs mt-6">${pos.id}</div>`;
                    }
                    
                    tableWrapper.appendChild(seatDiv);
                });

                container.appendChild(tableWrapper);
            });
        }

        // DEALER LOGIC
        function openDealerModal(tableId) {
            pendingDealerTableId = tableId;
            document.getElementById('dealer-name').value = '';
            document.getElementById('dealer-modal').classList.remove('hidden');
            document.getElementById('dealer-modal').classList.add('flex');
            document.getElementById('dealer-name').focus();
        }

        function closeDealerModal() {
            document.getElementById('dealer-modal').classList.add('hidden');
            document.getElementById('dealer-modal').classList.remove('flex');
        }

        function confirmAssignDealer() {
            const name = document.getElementById('dealer-name').value.trim();
            if(name && pendingDealerTableId && selectedTourId) {
                socket.emit('assign_dealer', { tour_id: selectedTourId, table_id: pendingDealerTableId, dealer_name: name });
                closeDealerModal();
            }
        }

        // MOVE TABLE LOGIC
        function openMoveModal(phone, name, currentTableId) {
            closeAllMenus();
            pendingMovePhone = phone;
            pendingMoveTourId = selectedTourId;
            
            document.getElementById('move-player-name').innerText = `${name} (${phone})`;
            
            const select = document.getElementById('move-table-select');
            select.innerHTML = '';
            
            const t = currentTours.find(x => x.id === selectedTourId);
            if(t) {
                t.tables.forEach(tblId => {
                    if(tblId !== currentTableId) {
                        const opt = document.createElement('option');
                        opt.value = tblId;
                        opt.innerText = `Bàn số ${tblId}`;
                        select.appendChild(opt);
                    }
                });
            }

            document.getElementById('move-modal').classList.remove('hidden');
            document.getElementById('move-modal').classList.add('flex');
        }

        function closeMoveModal() {
            document.getElementById('move-modal').classList.add('hidden');
            document.getElementById('move-modal').classList.remove('flex');
        }

        function confirmMoveTable() {
            const newTableId = document.getElementById('move-table-select').value;
            if(pendingMovePhone && pendingMoveTourId && newTableId) {
                socket.emit('move_player_table', { 
                    tour_id: pendingMoveTourId, 
                    player_phone: pendingMovePhone, 
                    new_table_id: newTableId 
                });
                closeMoveModal();
            }
        }

        function bustOut(phone) {
            if(confirm('Xác nhận BUST OUT khách hàng này?')) {
                socket.emit('bust_out', { tour_id: selectedTourId, player_phone: phone });
            }
        }
    </script>
</body>
</html>
