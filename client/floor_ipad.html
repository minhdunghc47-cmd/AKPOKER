<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const role = sessionStorage.getItem('acepoker_role');
        if (role !== 'floor' && role !== 'god') {
            window.location.href = './index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACEPOKER - Floor Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #0a0a0a; color: #d1d5db; -webkit-tap-highlight-color: transparent; }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .font-digital { font-family: 'Share Tech Mono', monospace; }
        .text-gold { color: #d4af37; }
        .btn-gold { background: linear-gradient(to bottom, #e5c158, #d4af37); color: #000; font-weight: bold; border-radius: 8px; border: none; transition: 0.2s; cursor: pointer; }
        .btn-gold:hover { filter: brightness(1.1); }

        /* TOUR CARD on lobby */
        .tour-card {
            background: linear-gradient(135deg, #161616, #111);
            border: 1px solid #333;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }
        .tour-card:hover { border-color: #d4af37; box-shadow: 0 0 20px rgba(212,175,55,0.2); transform: translateY(-2px); }
        .tour-card.running { border-color: #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.15); }

        /* STATUS BADGE */
        .badge-running { background: #d4af37; color: #000; }
        .badge-paused { background: #374151; color: #9ca3af; }
        .badge-finished { background: #800020; color: #fff; }

        /* POKER TABLE */
        .seat {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: #161616;
            border: 2px solid #333;
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: all 0.2s;
            overflow: visible;
        }
        .seat.occupied { border-color: #d4af37; background: #1a1a1a; }
        .seat.empty { border-style: dashed; opacity: 0.45; cursor: default; }
        .seat:active { transform: translate(-50%, -50%) scale(0.92); }

        .action-menu {
            position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) scale(0.9);
            opacity: 0; pointer-events: none; transition: all 0.15s; z-index: 100;
            min-width: 140px;
        }
        .action-menu.active {
            opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1);
        }

        .poker-table-bg {
            background: radial-gradient(ellipse at center, #1a4a28 0%, #0d2b15 100%);
            border: 6px solid #8c6222;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.9);
            border-radius: 120px;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }

        @keyframes breathe {
            0%,100% { box-shadow: 0 0 15px rgba(212,175,55,0.15); }
            50% { box-shadow: 0 0 30px rgba(212,175,55,0.4); }
        }
        .tour-card.running { animation: breathe 2s infinite; }
    
        /* Tối ưu hóa UI/UX cho màn hình cảm ứng & di động */
        button, select, input {
            min-height: 48px !important;
        }
        .seat {
            min-height: auto !important; /* Ngoại trừ ghế ngồi trên bàn poker */
        }
        @media (max-width: 1024px) {
            .table-container, table, .overflow-y-auto, .overflow-x-auto { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            body { padding: 10px !important; }
            /* Tăng khoảng cách các phần tử để dễ bấm trên iPad */
            .tour-card { margin-bottom: 20px; }
            .poker-table-bg { margin: 20px 0; }
        }
        @media (max-width: 768px) {
            /* Chuyển 2 cột thành 1 cột */
            .flex-row, .flex-1.flex.gap-6, .flex.gap-6, .flex.gap-8 { flex-direction: column !important; }
            .w-1\/3, .w-2\/3, .w-1\/4, .w-3\/4, .w-\[380px\], .w-\[480px\] { width: 100% !important; min-width: 100% !important; }
            .h-screen { height: auto !important; min-height: 100vh; overflow-y: auto !important; }
            body { overflow-y: auto !important; }
            .glass-panel { padding: 15px !important; }
            
            /* Dành cho các tour card/bàn */
            .grid-cols-2, .grid-cols-3, .xl\:grid-cols-2 { grid-template-columns: 1fr !important; }
            
            /* Đảm bảo khoảng cách chạm trên mobile */
            .tour-card { margin-bottom: 24px; }
            .poker-table-bg { margin: 24px 0; }
        }

    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- HEADER -->
    <header class="bg-[#111] border-b border-[#d4af37]/30 px-5 py-3 flex justify-between items-center shadow-lg shrink-0">
        <div class="flex items-center gap-3">
            <button id="btn-back" class="hidden bg-[#1a1a1a] border border-[#333] text-gray-400 px-3 py-1.5 rounded text-sm font-bold uppercase tracking-widest hover:border-[#d4af37] hover:text-[#d4af37] transition" onclick="showLobby()">
                <i class="fa-solid fa-arrow-left mr-1"></i> TOURS
            </button>
            <h1 class="font-mafia text-gold text-xl tracking-widest" id="header-title">
                <i class="fa-solid fa-tablet-screen-button mr-2"></i> FLOOR MANAGER
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-xs text-gray-500 font-bold uppercase tracking-widest font-digital" id="header-clock">00:00:00</div>
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_6px_rgba(52,211,153,0.8)]"></div>
        </div>
    </header>

    <!-- LOBBY: Tour List -->
    <main id="view-lobby" class="flex-1 overflow-y-auto p-5">
        <div class="text-xs text-gray-600 font-bold uppercase tracking-widest mb-4">Chọn giải đấu để quản lý bàn</div>
        <div id="tour-list" class="grid grid-cols-1 gap-4">
            <div class="text-center text-gray-600 font-bold uppercase tracking-widest py-16">Đang tải dữ liệu...</div>
        </div>
    </main>

    <!-- TABLE VIEW: Per tour -->
    <main id="view-tables" class="hidden flex-1 overflow-y-auto">
        <!-- Tour info bar -->
        <div class="bg-[#111] border-b border-[#222] px-5 py-3 flex gap-6 items-center justify-between shrink-0">
            <div class="flex gap-6 items-center text-xs font-bold uppercase tracking-widest flex-wrap">
                <div class="text-gray-500">LEVEL: <span class="text-[#d4af37]" id="tbl-level">—</span></div>
            <button class="bg-blue-900/40 border border-blue-500 text-blue-400 px-3 py-1.5 rounded font-bold uppercase tracking-widest text-xs hover:bg-blue-900/60 transition whitespace-nowrap" onclick="openAddTableToTourModal()">
                <i class="fa-solid fa-plus mr-1"></i>MỞ THÊM BÀN
            </button>
        </div>
            <div class="text-gray-500">CLOCK: <span class="text-white font-digital" id="tbl-clock">—</span></div>
            <div class="text-gray-500">PLAYERS: <span class="text-emerald-400" id="tbl-players">—</span></div>
            <div class="text-gray-500">BLINDS: <span class="text-emerald-400" id="tbl-blinds">—</span></div>
        </div>
        <!-- Tables grid -->
        <div id="tables-container" class="grid grid-cols-1 xl:grid-cols-2 gap-12 p-6 pb-24"></div>
    </main>

    
    <!-- MODAL MỞ THÊM BÀN -->
    <div id="add-table-modal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#161616] border border-[#d4af37] p-6 rounded-2xl w-[90%] max-w-[400px] shadow-[0_0_40px_rgba(212,175,55,0.2)]">
            <h3 class="text-lg font-mafia text-gold mb-4 text-center uppercase tracking-widest">
                <i class="fa-solid fa-plus-square mr-2"></i>MỞ THÊM BÀN
            </h3>
            <div class="mb-4">
                <label class="block text-[11px] font-bold text-[#d4af37] mb-2 uppercase tracking-widest">CHỌN BÀN RẢNH (IDLE):</label>
                <select id="idle-table-select" class="input-mafia text-sm font-bold w-full">
                </select>
            </div>
            <div class="flex gap-4">
                <button class="flex-1 py-3 bg-[#1a1a1a] border border-[#333] rounded text-[#d4af37] font-bold uppercase text-xs tracking-widest hover:bg-[#222]" onclick="closeAddTableToTourModal()">HỦY</button>
                <button class="flex-1 py-3 btn-gold rounded font-bold uppercase text-xs tracking-widest" onclick="confirmAddTableToTour()">THÊM BÀN</button>
            </div>
        </div>
    </div>

    <!-- MODAL GÁN DEALER -->
    <div id="dealer-modal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#161616] border border-[#d4af37] p-6 rounded-2xl w-[360px] shadow-[0_0_30px_rgba(212,175,55,0.3)]">
            <h3 class="text-lg font-mafia text-gold mb-4 uppercase text-center border-b border-[#333] pb-3">Gán Dealer Vào Bàn</h3>
            <label class="block text-[10px] font-bold text-[#d4af37] mb-2 uppercase tracking-widest">Dealer đang chờ:</label>
            <select id="dealer-select" class="w-full bg-[#111] border border-[#333] p-3 rounded-lg text-white mb-3 focus:border-[#d4af37] focus:outline-none text-sm font-bold">
                <option value="">— Chọn Dealer —</option>
            </select>
            <div class="text-[10px] text-gray-500 mb-2 text-center">— hoặc nhập tay —</div>
            <input type="text" id="dealer-name" class="w-full bg-[#111] border border-[#333] p-3 rounded-lg text-white mb-4 focus:border-[#d4af37] focus:outline-none text-sm" placeholder="Tên Dealer...">
            <div class="flex gap-3">
                <button class="flex-1 bg-[#1a1a1a] text-gray-400 py-3 rounded-lg font-bold uppercase hover:bg-[#222]" onclick="closeDealerModal()">Hủy</button>
                <button class="flex-1 btn-gold py-3 rounded-lg font-bold uppercase" onclick="confirmAssignDealer()">Xác Nhận</button>
            </div>
        </div>
    </div>

    <!-- MODAL CHUYỂN BÀN -->
    <div id="move-modal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#161616] border border-[#d4af37] p-6 rounded-2xl w-[360px] shadow-[0_0_30px_rgba(212,175,55,0.3)]">
            <h3 class="text-lg font-mafia text-gold mb-4 uppercase text-center border-b border-[#333] pb-3">Chuyển Bàn</h3>
            <div class="text-white text-center mb-4 font-bold text-sm" id="move-player-name"></div>
            <label class="block text-[10px] text-gray-400 font-bold uppercase mb-2">Chọn Bàn Đích:</label>
            <select id="move-table-select" class="w-full bg-[#111] border border-[#333] p-3 rounded-lg text-white mb-5 focus:border-[#d4af37] focus:outline-none"></select>
            <div class="flex gap-3">
                <button class="flex-1 bg-[#1a1a1a] text-gray-400 py-3 rounded-lg font-bold uppercase hover:bg-[#222]" onclick="closeMoveModal()">Hủy</button>
                <button class="flex-1 btn-gold py-3 rounded-lg font-bold uppercase" onclick="confirmMoveTable()">Chuyển</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');
        let currentTours = [];
        let globalTables = [];
        let currentStaff = [];
        let selectedTourId = null;
        let activeMenuSeatId = null;
        let pendingDealerTableId = null;
        let pendingMovePhone = null;

        const seatPositions = [
            { id: 1, x: 82, y: 18 }, { id: 2, x: 95, y: 50 }, { id: 3, x: 82, y: 82 },
            { id: 4, x: 62, y: 96 }, { id: 5, x: 50, y: 100 }, { id: 6, x: 38, y: 96 },
            { id: 7, x: 18, y: 82 }, { id: 8, x: 5, y: 50 },  { id: 9, x: 18, y: 18 }
        ];

        function formatTime(sec) {
            if(sec < 0) sec = 0;
            const m = Math.floor(sec/60).toString().padStart(2,'0');
            const s = (sec%60).toString().padStart(2,'0');
            return `${m}:${s}`;
        }
        function formatMoney(n) { return new Intl.NumberFormat('vi-VN').format(n||0); }

        // Real time clock
        setInterval(() => {
            const now = new Date();
            const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            document.getElementById('header-clock').innerText = t;
        }, 1000);

        socket.on('connect', () => socket.emit('request_initial_data'));

        
        let globalMembers = [];
        socket.on('update_members', (members) => {
            globalMembers = members;
            if(selectedTourId && !isAnyPopupOpen()) renderTableView();
        });

        socket.on('update_tours', (tours) => {
            currentTours = tours;
            renderLobby();
            if(selectedTourId && !isAnyPopupOpen()) renderTableView();
        });

        socket.on('update_tables', (tables) => {
            globalTables = tables;
            if(selectedTourId && !isAnyPopupOpen()) renderTableView();
        });

        function isAnyPopupOpen() {
            if (activeMenuSeatId !== null) return true;
            if (document.getElementById('dealer-modal') && !document.getElementById('dealer-modal').classList.contains('hidden')) return true;
            if (document.getElementById('move-modal') && !document.getElementById('move-modal').classList.contains('hidden')) return true;
            if (document.getElementById('add-table-modal') && !document.getElementById('add-table-modal').classList.contains('hidden')) return true;
            return false;
        }

        socket.on('update_staff_list', (staff) => { currentStaff = staff || []; });

        document.addEventListener('click', (e) => {
            if(!e.target.closest('.seat')) closeAllMenus();
        });

        // =====================
        // LOBBY
        // =====================
        function renderLobby() {
            const list = document.getElementById('tour-list');
            const active = currentTours.filter(t => t.status !== 'archived');
            if(active.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-600 font-bold uppercase tracking-widest py-16">Chưa có giải đấu nào đang hoạt động</div>';
                return;
            }
            list.innerHTML = '';
            active.forEach(t => {
                const alive = (t.players || []).filter(p => p.status === 'alive').length;
                const blind = t.blinds_structure?.[t.current_level_idx];
                const isBreak = blind?.is_break;
                const statusClass = t.status === 'running' ? 'badge-running' : t.status === 'finished' ? 'badge-finished' : 'badge-paused';
                const statusText = { running: '▶ ĐANG CHẠY', paused: '⏸ TẠM DỪNG', finished: '✓ KẾT THÚC' }[t.status] || t.status;
                
                const card = document.createElement('div');
                card.className = `tour-card p-5 ${t.status === 'running' ? 'running' : ''}`;
                card.onclick = () => openTourTables(t.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="font-mafia text-xl text-white tracking-wider">${t.name}</div>
                            <div class="text-xs text-gray-500 mt-1 font-bold uppercase tracking-widest">
                                Bàn ${(t.tables||[]).join(', ')} &nbsp;|&nbsp; Buy-in: ${t.buyin_fee ? formatMoney(t.buyin_fee) + '₫' : '—'}
                            </div>
                        </div>
                        <span class="text-xs font-bold px-2 py-1 rounded uppercase tracking-widest ${statusClass}">${statusText}</span>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center">
                        <div class="bg-[#0a0a0a] rounded-lg p-3 border border-[#222]">
                            <div class="text-[10px] text-gray-600 uppercase tracking-widest font-bold mb-1">Level</div>
                            <div class="text-gold font-bold text-lg font-digital">${isBreak ? 'BRK' : (blind?.level || '—')}</div>
                        </div>
                        <div class="bg-[#0a0a0a] rounded-lg p-3 border border-[#222]">
                            <div class="text-[10px] text-gray-600 uppercase tracking-widest font-bold mb-1">Clock</div>
                            <div class="text-white font-bold text-lg font-digital">${formatTime(t.time_remaining)}</div>
                        </div>
                        <div class="bg-[#0a0a0a] rounded-lg p-3 border border-[#222]">
                            <div class="text-[10px] text-gray-600 uppercase tracking-widest font-bold mb-1">Còn lại</div>
                            <div class="text-emerald-400 font-bold text-lg">${alive}<span class="text-gray-600 text-sm">/${t.entries}</span></div>
                        </div>
                        <div class="bg-[#0a0a0a] rounded-lg p-3 border border-[#222]">
                            <div class="text-[10px] text-gray-600 uppercase tracking-widest font-bold mb-1">Blinds</div>
                            <div class="text-white font-bold text-sm font-digital">
                                ${isBreak ? '<span class="text-red-400">BREAK</span>' : (blind ? `${formatMoney(blind.sb)}/${formatMoney(blind.bb)}` : '—')}
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-end">
                        <span class="text-xs text-[#d4af37] font-bold uppercase tracking-widest">
                            Quản lý bàn <i class="fa-solid fa-chevron-right ml-1"></i>
                        </span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function openTourTables(tourId) {
            selectedTourId = tourId;
            document.getElementById('view-lobby').classList.add('hidden');
            document.getElementById('view-tables').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');

            const t = currentTours.find(x => x.id === tourId);
            document.getElementById('header-title').innerHTML = `<i class="fa-solid fa-table mr-2 text-sm"></i><span class="font-mafia text-gold">${t?.name || 'Quản lý Bàn'}</span>`;
            renderTableView();
        }

        function showLobby() {
            selectedTourId = null;
            document.getElementById('view-tables').classList.add('hidden');
            document.getElementById('view-lobby').classList.remove('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('header-title').innerHTML = '<i class="fa-solid fa-tablet-screen-button mr-2"></i> FLOOR MANAGER';
        }

        // =====================
        // TABLE VIEW
        // =====================
        function renderTableView() {
            if(!selectedTourId) return;
            const t = currentTours.find(x => x.id === selectedTourId);
            if(!t) return;

            // Update info bar
            const blind = t.blinds_structure?.[t.current_level_idx];
            const isBreak = blind?.is_break;
            document.getElementById('tbl-level').innerText = isBreak ? 'BREAK' : `${blind?.level || '—'}`;
            document.getElementById('tbl-clock').innerText = formatTime(t.time_remaining);
            const alive = (t.players||[]).filter(p => p.status === 'alive').length;
            document.getElementById('tbl-players').innerText = `${alive}/${t.entries}`;
            document.getElementById('tbl-blinds').innerText = isBreak ? 'BREAK' : (blind ? `${formatMoney(blind.sb)}/${formatMoney(blind.bb)} BBA:${formatMoney(blind.ante)}` : '—');

            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            
            // BALANCE WARNING CHECK
            if (t.tables && t.tables.length > 1) {
                const counts = t.tables.map(tid => (t.players||[]).filter(p => p.table_id === tid && p.status === 'alive').length);
                const max = Math.max(...counts);
                const min = Math.min(...counts);
                if (max - min >= 2) {
                    const warningHtml = `<div class="mx-6 mt-6 bg-[#800020]/20 border border-[#800020] rounded-xl p-4 flex items-center justify-between shadow-[0_0_15px_rgba(128,0,32,0.4)] animate-pulse">
                        <div class="flex items-center gap-4">
                            <div class="bg-[#800020] text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div>
                                <h4 class="text-[#ff4c4c] font-mafia tracking-widest uppercase text-lg">Yêu Cầu Balance Bàn!</h4>
                                <p class="text-red-300 text-xs font-bold uppercase tracking-widest mt-1">Hệ thống phát hiện độ lệch ${max - min} khách giữa các bàn. Vui lòng chuyển khách ngay!</p>
                            </div>
                        </div>
                    </div>`;
                    container.innerHTML += warningHtml;
                }
            }

            const tourTables = globalTables.filter(tbl => (t.tables||[]).includes(tbl.id));
            tourTables.forEach(tbl => {
                const tablePlayers = (t.players||[]).filter(p => p.table_id === tbl.id && p.status === 'alive');

                const tableWrapper = document.createElement('div');
                tableWrapper.className = 'w-full max-w-[680px] h-[340px] mx-auto relative mt-8 mb-8';

                const dealerHtml = tbl.dealer_name
                    ? `<div class="text-[#d4af37] text-sm font-mafia tracking-widest bg-black/60 px-3 py-1 rounded-full border border-[#d4af37]/30 cursor-pointer hover:bg-black/80 transition shadow-[0_0_10px_rgba(212,175,55,0.2)]" onclick="openDealerModal(${tbl.id})">
                           <i class="fa-solid fa-hands-holding-circle mr-1"></i>${tbl.dealer_name}
                       </div>`
                    : `<button class="text-red-500 font-bold animate-pulse text-[11px] bg-black/60 px-3 py-1 rounded-full border border-red-500/50 cursor-pointer hover:bg-black/80 tracking-widest uppercase" onclick="openDealerModal(${tbl.id})">
                           ⚠️ THIẾU DEALER
                       </button>`;
                       
                tableWrapper.innerHTML = `
                    <div class="absolute inset-x-10 inset-y-6 poker-table-bg flex flex-col items-center justify-center">
                        <div class="absolute top-3 w-full px-8 flex justify-center items-start pointer-events-none">
                            <div class="text-gray-500 font-bold tracking-widest text-xs opacity-50">BÀN ${tbl.id}</div>
                        </div>
                        
                        <div class="absolute top-7">${dealerHtml}</div>
                        <div class="text-white/10 font-mafia text-5xl tracking-widest uppercase mt-2 pointer-events-none">ACE</div>
                        <button class="mt-3 bg-red-900/40 border border-red-500 text-red-400 px-4 py-1.5 rounded-full font-bold uppercase tracking-widest text-[10px] hover:bg-red-900/80 transition shadow-[0_0_10px_rgba(220,38,38,0.3)] z-10 relative" onclick="closeTableFromTour(${tbl.id})">
                            <i class="fa-solid fa-minus mr-1"></i>ĐÓNG BÀN
                        </button>
                    </div>
                `;

                seatPositions.forEach((pos, index) => {
                    const player = tablePlayers.find(p => p.seat === pos.id);
                    const seatDiv = document.createElement('div');
                    seatDiv.className = `seat ${player ? 'occupied' : 'empty'}`;
                    seatDiv.style.cssText = `left:${pos.x}%;top:${pos.y}%;`;

                    if(player) {
                        
                        const uid = `seat_${tbl.id}_${index}`;
                        const member = globalMembers.find(m => m.phone === player.phone);
                        const buyinCount = (t.players||[]).filter(x => x.phone === player.phone).length;
                        
                        let seatInner = '';
                        if (member && member.avatar_base64) {
                            seatInner = `
                                <img src="${member.avatar_base64}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center; border: 2px solid #d4af37;" />
                                <div class="absolute inset-x-0 bottom-0 bg-black/70 text-center rounded-b-full pb-1 pointer-events-none">
                                    <div class="text-[8px] text-white font-bold truncate px-1">${(player.name||'').split(' ').pop()}</div>
                                </div>
                            `;
                        } else {
                            seatInner = `
                                <div class="flex flex-col items-center justify-center w-full h-full p-1 bg-[#1a1a1a] rounded-full border border-[#d4af37]/30">
                                    <div class="text-[9px] text-[#d4af37] font-bold truncate w-full text-center leading-tight">${player.phone?.slice(-4) || ''}</div>
                                    <div class="text-[11px] text-white font-bold truncate w-full text-center mt-0.5 leading-tight">${(player.name||'').split(' ').pop()}</div>
                                    <div class="text-[8px] text-gray-500 font-bold leading-tight">G${player.seat || pos.id}</div>
                                </div>
                            `;
                        }

                        seatDiv.onclick = (e) => toggleMenu(e, uid);
                        seatDiv.innerHTML = `
                            ${seatInner}
                            <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-[#222] border border-[#d4af37] text-[#d4af37] px-1.5 py-0.5 rounded-full text-[8px] font-bold shadow-md z-20 whitespace-nowrap pointer-events-none">
                                🎟️ Lượt: ${buyinCount}
                            </div>
                            <div id="menu-${uid}" class="action-menu bg-[#1a1a1a] border border-[#d4af37]/50 rounded-xl p-2 shadow-2xl flex flex-col gap-1 w-36">
                                <button class="w-full text-left px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-emerald-400 hover:bg-[#333] rounded-lg" onclick="openMoveModal('${player.phone}','${(player.name||'').replace(/'/g,"\\'")}',${tbl.id})">
                                    <i class="fa-solid fa-rotate mr-2"></i>Chuyển Bàn
                                </button>
                                <button class="w-full text-left px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-red-500 hover:bg-[#333] rounded-lg" onclick="bustOut('${player.phone}')">
                                    <i class="fa-solid fa-skull mr-2"></i>Bust Out
                                </button>
                            </div>
                        `;
                    } else {
                        seatDiv.innerHTML = `<div class="text-gray-700 font-bold text-xs">${pos.id}</div>`;
                    }
                    tableWrapper.appendChild(seatDiv);
                });

                container.appendChild(tableWrapper);
            });
        }

        
        function closeAllMenus(skipRender = false) { 
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
            activeMenuSeatId = null;
            if(!skipRender && selectedTourId) renderTableView(); 
        }
        function toggleMenu(e, uid) {
            e.stopPropagation();
            const menu = document.getElementById(`menu-${uid}`);
            
            if(activeMenuSeatId === uid) { activeMenuSeatId = null; renderTableView(); }

            
            else { closeAllMenus(true); document.getElementById('menu-'+uid).classList.add('active'); activeMenuSeatId = uid; }

        }

        
        // =====================
        // TABLE MANAGEMENT
        // =====================
        function openAddTableToTourModal() {
            const select = document.getElementById('idle-table-select');
            select.innerHTML = '<option value="">-- Chọn Bàn Trống --</option>';
            const idleTables = globalTables.filter(t => !t.is_locked);
            if(idleTables.length === 0) {
                alert("Hiện không có bàn nào rảnh!");
                return;
            }
            idleTables.forEach(t => {
                select.innerHTML += `<option value="${t.id}">Bàn ${t.id}</option>`;
            });
            document.getElementById('add-table-modal').classList.remove('hidden');
            document.getElementById('add-table-modal').classList.add('flex');
        }
        function closeAddTableToTourModal() {
            document.getElementById('add-table-modal').classList.replace('flex', 'hidden');
        }
        function confirmAddTableToTour() {
            const tableId = document.getElementById('idle-table-select').value;
            if(!tableId || !selectedTourId) {
                alert("Vui lòng chọn bàn rảnh cần mở!");
                return;
            }
            if(confirm(`Xác nhận MỞ THÊM Bàn ${tableId} vào giải đấu này?`)) {
                socket.emit('add_table_to_tour', { tour_id: selectedTourId, table_id: parseInt(tableId) });
                closeAddTableToTourModal();
            }
        }
        function closeTableFromTour(tableId) {
            if(!selectedTourId) return;
            const t = currentTours.find(x => x.id === selectedTourId);
            if(!t) return;
            const alive = (t.players||[]).filter(p => p.table_id === tableId && p.status === 'alive');
            if(alive.length > 0) {
                alert(`Bàn ${tableId} đang có ${alive.length} khách chơi. Vui lòng chuyển hết khách sang bàn khác trước khi đóng!`);
                return;
            }
            if(confirm(`Bạn có chắc chắn muốn ĐÓNG Bàn ${tableId} không? (Dealer sẽ được nghỉ)`)) {
                socket.emit('remove_table_from_tour', { tour_id: selectedTourId, table_id: tableId });
            }
        }

        // =====================
        // DEALER MODAL
        // =====================
        function openDealerModal(tableId) {
            pendingDealerTableId = tableId;
            document.getElementById('dealer-name').value = '';
            const select = document.getElementById('dealer-select');
            select.innerHTML = '<option value="">— Chọn Dealer —</option>';
            const dealers = currentStaff.filter(s =>
                (s.role === 'Dealer' || s.role === 'dealer') &&
                (s.status === 'waiting' || s.status === 'online') &&
                s.work_status === 'ACTIVE'
            );
            if(!dealers.length) {
                select.innerHTML += '<option disabled>— Không có Dealer đang chờ —</option>';
            } else {
                dealers.forEach(d => {
                    const o = document.createElement('option');
                    o.value = d.name; o.innerText = `${d.id} - ${d.name}`;
                    select.appendChild(o);
                });
            }
            document.getElementById('dealer-modal').classList.remove('hidden');
            document.getElementById('dealer-modal').classList.add('flex');
        }
        function closeDealerModal() { 
            document.getElementById('dealer-modal').classList.replace('flex','hidden');
         renderTableView(); }
        function confirmAssignDealer() {
            const name = document.getElementById('dealer-select').value || document.getElementById('dealer-name').value.trim();
            if(name && pendingDealerTableId && selectedTourId) {
                socket.emit('assign_dealer', { tour_id: selectedTourId, table_id: pendingDealerTableId, dealer_name: name });
                closeDealerModal();
            } else {
                alert('Vui lòng chọn hoặc nhập tên Dealer!');
            }
        }

        // =====================
        // MOVE TABLE MODAL
        // =====================
        function openMoveModal(phone, name, currentTableId) {
            closeAllMenus();
            pendingMovePhone = phone;
            document.getElementById('move-player-name').innerText = `${name} (${phone})`;
            const select = document.getElementById('move-table-select');
            select.innerHTML = '';
            const t = currentTours.find(x => x.id === selectedTourId);
            if(t) {
                (t.tables||[]).forEach(id => {
                    if(id !== currentTableId) {
                        const o = document.createElement('option');
                        o.value = id; o.innerText = `Bàn số ${id}`;
                        select.appendChild(o);
                    }
                });
            }
            document.getElementById('move-modal').classList.remove('hidden');
            document.getElementById('move-modal').classList.add('flex');
        }
        function closeMoveModal() { 
            document.getElementById('move-modal').classList.replace('flex','hidden');
         renderTableView(); }
        function confirmMoveTable() {
            const newId = document.getElementById('move-table-select').value;
            if(pendingMovePhone && selectedTourId && newId) {
                socket.emit('move_player_table', { tour_id: selectedTourId, player_phone: pendingMovePhone, new_table_id: newId });
                closeMoveModal();
            }
        }

        // =====================
        // BUST OUT
        // =====================
        function bustOut(phone) {
            if(confirm('Xác nhận BUST OUT khách này?')) {
                socket.emit('bust_out', { tour_id: selectedTourId, player_phone: phone });
            }
        }
    </script>
</body>
</html>
