<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const role = sessionStorage.getItem('acepoker_role');
        if (role !== 'god') {
            window.location.href = './index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEPOKER - Quản Lý Nhân Sự (HR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #d1d5db; }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .glass-panel { background: #111; border: 1px solid #333; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">
    <header class="flex justify-between items-center mb-6 border-b border-[#333] pb-4">
        <div>
            <h1 class="text-3xl font-mafia text-[#d4af37] tracking-widest"><i class="fa-solid fa-users mr-3"></i>HR MANAGEMENT</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Phân hệ Quản Trị Nhân Sự (God Mode)</p>
        </div>
        <div class="flex gap-4">
            <a href="./index.html" class="px-6 py-2 bg-[#222] hover:bg-[#333] text-gray-300 font-bold rounded uppercase text-sm tracking-widest transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Thoát
            </a>
        </div>
    </header>

    <div class="flex gap-6 flex-1 overflow-hidden">
        <!-- FORM BỔ NHIỆM -->
        <div class="w-1/3 glass-panel p-6 rounded-lg flex flex-col gap-4 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-[#333] pb-2">
                <h2 class="text-xl font-mafia text-[#d4af37] uppercase tracking-widest"><i class="fa-solid fa-user-plus mr-2"></i>Bổ Nhiệm</h2>
                <button onclick="resetStaffForm()" class="px-3 py-1 border border-[#d4af37] text-[#d4af37] hover:bg-[#d4af37] hover:text-black font-bold rounded text-xs uppercase tracking-widest transition-colors">
                    [+] Tạo Mới
                </button>
            </div>
            
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Mã NV (ID)</label>
                <input type="text" id="hr-id" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="VD: NV01">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Tên Nhân Viên</label>
                <input type="text" id="hr-name" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="Nguyễn Văn A">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Mã PIN CÁ NHÂN (Mật khẩu)</label>
                <input type="password" id="hr-pin" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none text-xl tracking-[0.5em]" placeholder="****">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Ngày sinh</label>
                    <input type="date" id="hr-dob" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Số CCCD</label>
                    <input type="text" id="hr-cccd" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="0123456789">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Ngày cấp</label>
                    <input type="date" id="hr-cccd-date" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Địa chỉ</label>
                    <input type="text" id="hr-address" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="Hà Nội">
                </div>
            </div>

            <!-- CAMERA BLOCK -->
            <div class="border border-[#333] p-3 rounded bg-[#151515]">
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">📸 Ảnh Nhận Diện</label>
                <div class="flex gap-4 items-center">
                    <div class="relative w-24 h-24 bg-[#111] border border-[#333] rounded overflow-hidden flex-shrink-0 flex items-center justify-center">
                        <video id="camera-stream" autoplay playsinline class="hidden w-full h-full object-cover"></video>
                        <img id="photo-preview" class="hidden w-full h-full object-cover">
                        <i id="photo-placeholder" class="fa-solid fa-user text-3xl text-gray-600"></i>
                    </div>
                    <div class="flex flex-col gap-2 flex-1">
                        <button id="btn-start-camera" onclick="startCamera()" class="w-full bg-[#222] hover:bg-[#333] border border-[#d4af37]/50 text-[#d4af37] py-2 rounded text-xs uppercase font-bold transition-colors">
                            <i class="fa-solid fa-camera mr-1"></i> Bật Camera
                        </button>
                        <button id="btn-take-photo" onclick="takePhoto()" class="hidden w-full bg-blue-700 hover:bg-blue-600 text-white py-2 rounded text-xs uppercase font-bold transition-colors">
                            <i class="fa-solid fa-circle-dot mr-1"></i> Chụp Ảnh
                        </button>
                    </div>
                </div>
                <canvas id="photo-canvas" class="hidden" width="300" height="300"></canvas>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Chức Danh</label>
                <select id="hr-role" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none">
                    <option value="Dealer">Dealer</option>
                    <option value="Floor">Floor</option>
                    <option value="Thu ngân">Thu ngân</option>
                    <option value="Phục vụ">Phục vụ</option>
                    <option value="TD">Tournament Director (TD)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Lương Cơ Bản (VNĐ/Giờ)</label>
                <input type="number" id="hr-salary" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" value="50000">
            </div>
            <div class="flex flex-col gap-2 mt-4">
                <button id="btn-submit" onclick="submitStaff()" class="w-full bg-[#d4af37] hover:bg-[#b5952f] text-black font-bold uppercase tracking-widest py-3 rounded transition-colors shadow-lg">
                    <i class="fa-solid fa-save mr-2"></i> LƯU HỒ SƠ
                </button>
                <div class="flex gap-2">
                    <button id="btn-cancel" onclick="resetStaffForm()" class="hidden flex-1 bg-[#333] hover:bg-[#444] text-white font-bold uppercase tracking-widest py-3 rounded transition-colors shadow-lg">
                        HỦY
                    </button>
                    <button id="btn-resign" onclick="resignStaff()" class="hidden flex-1 bg-[#800020] hover:bg-red-700 text-white font-bold uppercase tracking-widest py-3 rounded transition-colors shadow-lg">
                        ⛔ THÔI VIỆC
                    </button>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH NHÂN SỰ -->
        <div class="w-2/3 glass-panel p-6 rounded-lg overflow-y-auto">
            <h2 class="text-xl font-mafia text-[#d4af37] uppercase tracking-widest mb-4 border-b border-[#333] pb-2"><i class="fa-solid fa-users-viewfinder mr-2"></i>Danh Sách Nhân Sự & Bảng Lương</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-xs uppercase tracking-widest text-gray-500 border-b border-[#333]">
                        <th class="p-3">Mã NV</th>
                        <th class="p-3">Họ Tên</th>
                        <th class="p-3">Chức Danh</th>
                        <th class="p-3">Trạng Thái</th>
                        <th class="p-3">Tổng Giờ</th>
                        <th class="p-3 text-right">Lương Tạm Tính</th>
                    </tr>
                </thead>
                <tbody id="staff-table" class="text-sm">
                    <!-- Data here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');

        
        
        
        socket.on('connect', () => {
            socket.emit('request_initial_data');
        });

        socket.on('update_staff_list', (staffList) => {
            const tbody = document.getElementById('staff-table');
            tbody.innerHTML = '';
            
            if(staffList) {
                staffList.sort((a, b) => {
                    const aResigned = a.work_status === 'RESIGNED' ? 1 : 0;
                    const bResigned = b.work_status === 'RESIGNED' ? 1 : 0;
                    return aResigned - bResigned;
                });

                staffList.forEach(s => {
                    const isResigned = s.work_status === 'RESIGNED';
                    const hours = (s.total_minutes / 60).toFixed(2);
                    const salary = (s.total_minutes / 60) * s.base_salary;
                    
                    let statusColor = s.status === 'offline' ? 'text-gray-500' : 'text-[#2ecc71]';
                    if(s.status === 'waiting') statusColor = 'text-[#d4af37]';
                    let statusText = s.status;
                    
                    let rowClass = "border-b border-[#222] hover:bg-[#333] cursor-pointer transition-colors";
                    let textNameClass = "text-white";
                    
                    if (isResigned) {
                        rowClass += " opacity-50";
                        statusText = "ĐÃ THÔI VIỆC";
                        statusColor = "text-red-500";
                        textNameClass = "text-gray-500";
                    }
                    
                    tbody.innerHTML += `
                        <tr class="${rowClass}" onclick='editStaff(this.getAttribute("data-staff"))' data-staff='${JSON.stringify(s).replace(/'/g, "&apos;").replace(/"/g, "&quot;")}'>
                            <td class="p-3 text-gray-400 font-bold">${s.id}</td>
                            <td class="p-3 ${textNameClass}">${s.name}</td>
                            <td class="p-3 text-[#d4af37]">${s.role}</td>
                            <td class="p-3 ${statusColor} uppercase font-bold text-xs">${statusText}</td>
                            <td class="p-3">${hours}h</td>
                            <td class="p-3 text-right text-green-400 font-bold">${new Intl.NumberFormat('vi-VN', {style:'currency', currency:'VND'}).format(salary)}</td>
                        </tr>
                    `;
                });
            }
        });

        
        let isEditing = false;
        let currentPhotoBase64 = '';
        let stream = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('camera-stream');
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('photo-preview').classList.add('hidden');
                document.getElementById('photo-placeholder').classList.add('hidden');
                
                document.getElementById('btn-start-camera').classList.add('hidden');
                document.getElementById('btn-take-photo').classList.remove('hidden');
            } catch (err) {
                alert("Không thể truy cập Camera: " + err.message);
            }
        }

        function takePhoto() {
            if (!stream) return;
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('photo-canvas');
            const ctx = canvas.getContext('2d');
            
            // Draw video frame to 300x300 canvas
            ctx.drawImage(video, 0, 0, 300, 300);
            currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            
            // Stop camera
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            
            // Show preview
            video.classList.add('hidden');
            const preview = document.getElementById('photo-preview');
            preview.src = currentPhotoBase64;
            preview.classList.remove('hidden');
            
            document.getElementById('btn-start-camera').classList.remove('hidden');
            document.getElementById('btn-start-camera').innerHTML = '<i class="fa-solid fa-camera mr-1"></i> Chụp Lại';
            document.getElementById('btn-take-photo').classList.add('hidden');
        }

        function editStaff(staffStr) {
            const s = JSON.parse(staffStr);
            isEditing = true;
            document.getElementById('hr-id').value = s.id;
            document.getElementById('hr-id').disabled = true;
            document.getElementById('hr-id').classList.add('opacity-50', 'cursor-not-allowed');
            
            document.getElementById('hr-name').value = s.name;
            document.getElementById('hr-pin').value = s.pin || '';
            document.getElementById('hr-role').value = s.role;
            document.getElementById('hr-salary').value = s.base_salary;
            
            document.getElementById('hr-dob').value = s.dob || '';
            document.getElementById('hr-cccd').value = s.cccd || '';
            document.getElementById('hr-cccd-date').value = s.cccd_date || '';
            document.getElementById('hr-address').value = s.address || '';
            
            if (s.photo) {
                currentPhotoBase64 = s.photo;
                const preview = document.getElementById('photo-preview');
                preview.src = s.photo;
                preview.classList.remove('hidden');
                document.getElementById('photo-placeholder').classList.add('hidden');
                document.getElementById('btn-start-camera').innerHTML = '<i class="fa-solid fa-camera mr-1"></i> Chụp Lại';
            } else {
                currentPhotoBase64 = '';
                document.getElementById('photo-preview').classList.add('hidden');
                document.getElementById('photo-placeholder').classList.remove('hidden');
                document.getElementById('btn-start-camera').innerHTML = '<i class="fa-solid fa-camera mr-1"></i> Bật Camera';
            }
            
            if(stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                document.getElementById('camera-stream').classList.add('hidden');
                document.getElementById('btn-start-camera').classList.remove('hidden');
                document.getElementById('btn-take-photo').classList.add('hidden');
            }
            
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-save mr-2"></i> CẬP NHẬT';
            document.getElementById('btn-submit').classList.replace('bg-[#d4af37]', 'bg-blue-600');
            document.getElementById('btn-submit').classList.replace('hover:bg-[#b5952f]', 'hover:bg-blue-500');
            document.getElementById('btn-cancel').classList.remove('hidden');
            document.getElementById('btn-resign').classList.remove('hidden');
        }

        function resetStaffForm() {
            isEditing = false;
            const hrIdInput = document.getElementById('hr-id');
            hrIdInput.value = '';
            hrIdInput.disabled = false;
            hrIdInput.classList.remove('opacity-50', 'cursor-not-allowed');
            
            document.getElementById('hr-name').value = '';
            document.getElementById('hr-pin').value = '';
            document.getElementById('hr-role').value = 'Dealer';
            document.getElementById('hr-salary').value = '50000';
            document.getElementById('hr-dob').value = '';
            document.getElementById('hr-cccd').value = '';
            document.getElementById('hr-cccd-date').value = '';
            document.getElementById('hr-address').value = '';
            
            currentPhotoBase64 = '';
            document.getElementById('photo-preview').classList.add('hidden');
            document.getElementById('photo-placeholder').classList.remove('hidden');
            document.getElementById('btn-start-camera').innerHTML = '<i class="fa-solid fa-camera mr-1"></i> Bật Camera';
            
            if(stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                document.getElementById('camera-stream').classList.add('hidden');
                document.getElementById('btn-start-camera').classList.remove('hidden');
                document.getElementById('btn-take-photo').classList.add('hidden');
            }

            
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-save mr-2"></i> LƯU HỒ SƠ';
            document.getElementById('btn-submit').classList.replace('bg-blue-600', 'bg-[#d4af37]');
            document.getElementById('btn-submit').classList.replace('hover:bg-blue-500', 'hover:bg-[#b5952f]');
            document.getElementById('btn-cancel').classList.add('hidden');
            document.getElementById('btn-resign').classList.add('hidden');
            
            hrIdInput.focus();
        }

        function submitStaff() {
            const payload = {
                id: document.getElementById('hr-id').value,
                name: document.getElementById('hr-name').value,
                pin: document.getElementById('hr-pin').value,
                role: document.getElementById('hr-role').value,
                base_salary: document.getElementById('hr-salary').value,

                dob: document.getElementById('hr-dob').value,
                cccd: document.getElementById('hr-cccd').value,
                cccd_date: document.getElementById('hr-cccd-date').value,
                address: document.getElementById('hr-address').value,
                photo: currentPhotoBase64

            };
            if(!payload.id || !payload.name || ( !isEditing && !payload.pin )) return alert("Vui lòng nhập đủ thông tin ID, Tên, và PIN");
            
            const eventName = isEditing ? 'update_staff' : 'add_staff';
            
            socket.emit(eventName, payload, (res) => {
                alert(res.message);
                if(res.success) {
                    resetStaffForm();
                }
            });
        }

        function resignStaff() {
            const id = document.getElementById('hr-id').value;
            if(!id) return;
            if(confirm("Bạn có chắc chắn muốn cho nhân viên này thôi việc? Dữ liệu sẽ được lưu trữ để đối soát.")) {
                socket.emit('resign_staff', id, (res) => {
                    alert(res.message);
                    if(res.success) {
                        resetStaffForm();
                    }
                });
            }
        }
    </script>
</body>
</html>
