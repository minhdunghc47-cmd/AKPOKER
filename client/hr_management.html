<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const role = sessionStorage.getItem('acepoker_role');
        if (role !== 'god') {
            window.location.href = './index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEPOKER - Quản Lý Nhân Sự (HR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #d1d5db; }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .glass-panel { background: #111; border: 1px solid #333; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">
    <header class="flex justify-between items-center mb-6 border-b border-[#333] pb-4">
        <div>
            <h1 class="text-3xl font-mafia text-[#d4af37] tracking-widest"><i class="fa-solid fa-users mr-3"></i>HR MANAGEMENT</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Phân hệ Quản Trị Nhân Sự (God Mode)</p>
        </div>
        <div class="flex gap-4">
            <a href="./index.html" class="px-6 py-2 bg-[#222] hover:bg-[#333] text-gray-300 font-bold rounded uppercase text-sm tracking-widest transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Thoát
            </a>
        </div>
    </header>

    <div class="flex gap-6 flex-1 overflow-hidden">
        <!-- FORM BỔ NHIỆM -->
        <div class="w-1/3 glass-panel p-6 rounded-lg flex flex-col gap-4">
            <h2 class="text-xl font-mafia text-[#d4af37] uppercase tracking-widest mb-4 border-b border-[#333] pb-2"><i class="fa-solid fa-user-plus mr-2"></i>Bổ Nhiệm Nhân Sự</h2>
            
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Mã NV (ID)</label>
                <input type="text" id="hr-id" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="VD: NV01">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Tên Nhân Viên</label>
                <input type="text" id="hr-name" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" placeholder="Nguyễn Văn A">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Mã PIN CÁ NHÂN (Mật khẩu)</label>
                <input type="password" id="hr-pin" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none text-xl tracking-[0.5em]" placeholder="****">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Chức Danh</label>
                <select id="hr-role" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none">
                    <option value="Dealer">Dealer</option>
                    <option value="Floor">Floor</option>
                    <option value="Thu ngân">Thu ngân</option>
                    <option value="Phục vụ">Phục vụ</option>
                    <option value="TD">Tournament Director (TD)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-1">Lương Cơ Bản (VNĐ/Giờ)</label>
                <input type="number" id="hr-salary" class="w-full bg-[#1a1a1a] border border-[#333] p-2 rounded text-white focus:border-[#d4af37] outline-none" value="50000">
            </div>
            <button onclick="addStaff()" class="w-full mt-4 bg-[#d4af37] hover:bg-[#b5952f] text-black font-bold uppercase tracking-widest py-3 rounded transition-colors shadow-lg">
                Lưu Hồ Sơ
            </button>
        </div>

        <!-- DANH SÁCH NHÂN SỰ -->
        <div class="w-2/3 glass-panel p-6 rounded-lg overflow-y-auto">
            <h2 class="text-xl font-mafia text-[#d4af37] uppercase tracking-widest mb-4 border-b border-[#333] pb-2"><i class="fa-solid fa-users-viewfinder mr-2"></i>Danh Sách Nhân Sự & Bảng Lương</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-xs uppercase tracking-widest text-gray-500 border-b border-[#333]">
                        <th class="p-3">Mã NV</th>
                        <th class="p-3">Họ Tên</th>
                        <th class="p-3">Chức Danh</th>
                        <th class="p-3">Trạng Thái</th>
                        <th class="p-3">Tổng Giờ</th>
                        <th class="p-3 text-right">Lương Tạm Tính</th>
                    </tr>
                </thead>
                <tbody id="staff-table" class="text-sm">
                    <!-- Data here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');

        socket.on('update_staff_list', (staffList) => {
            const tbody = document.getElementById('staff-table');
            tbody.innerHTML = '';
            
            if(staffList) {
                staffList.forEach(s => {
                    const hours = (s.total_minutes / 60).toFixed(2);
                    const salary = (s.total_minutes / 60) * s.base_salary;
                    let statusColor = s.status === 'offline' ? 'text-gray-500' : 'text-[#2ecc71]';
                    if(s.status === 'waiting') statusColor = 'text-[#d4af37]';
                    
                    tbody.innerHTML += `
                        <tr class="border-b border-[#222] hover:bg-[#1a1a1a]">
                            <td class="p-3 text-gray-400 font-bold">${s.id}</td>
                            <td class="p-3 text-white">${s.name}</td>
                            <td class="p-3 text-[#d4af37]">${s.role}</td>
                            <td class="p-3 ${statusColor} uppercase font-bold text-xs">${s.status}</td>
                            <td class="p-3">${hours}h</td>
                            <td class="p-3 text-right text-green-400 font-bold">${new Intl.NumberFormat('vi-VN', {style:'currency', currency:'VND'}).format(salary)}</td>
                        </tr>
                    `;
                });
            }
        });

        function addStaff() {
            const payload = {
                id: document.getElementById('hr-id').value,
                name: document.getElementById('hr-name').value,
                pin: document.getElementById('hr-pin').value,
                role: document.getElementById('hr-role').value,
                base_salary: document.getElementById('hr-salary').value
            };
            if(!payload.id || !payload.name || !payload.pin) return alert("Vui lòng nhập đủ thông tin ID, Tên, và PIN");
            
            socket.emit('add_staff', payload, (res) => {
                alert(res.message);
                if(res.success) {
                    document.getElementById('hr-id').value = '';
                    document.getElementById('hr-name').value = '';
                    document.getElementById('hr-pin').value = '';
                }
            });
        }
    </script>
</body>
</html>
