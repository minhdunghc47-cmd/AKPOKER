<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker TMS 2.0 - Sảnh Chính</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080808; 
            color: #e2e8f0;
            background-image: radial-gradient(circle at center, #1a0f14 0%, #080808 100%);
        }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .glass-panel {
            background: #111111;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .glass-panel:hover {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-5px);
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }
        .pulse-dot {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.8); }
            70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-12 z-10">
        
        <div class="text-center">
            <h1 class="text-5xl md:text-6xl font-mafia text-[#d4af37] tracking-widest drop-shadow-lg neon-glow mb-4">
                <i class="fa-solid fa-dice mr-3"></i>HỆ THỐNG QUẢN TRỊ POKER TMS 2.0
            </h1>
            <p class="text-gray-400 text-sm md:text-base uppercase tracking-[0.4em] font-bold">Sảnh Điều Hướng Trung Tâm</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
            
            <a href="./cashier.html" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center group text-center cursor-pointer">
                <i class="fa-solid fa-money-bill-wave text-5xl text-[#d4af37] mb-4 group-hover:scale-110 transition-transform"></i>
                <h2 class="font-mafia text-2xl text-gray-200 uppercase tracking-widest mb-2 group-hover:text-[#d4af37] transition-colors">POS Thu Ngân</h2>
                <p class="text-gray-500 text-xs uppercase tracking-wider">Quản lý quỹ & Hội viên</p>
            </a>

            <a href="./td_dashboard.html" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center group text-center cursor-pointer">
                <i class="fa-solid fa-gamepad text-5xl text-[#d4af37] mb-4 group-hover:scale-110 transition-transform"></i>
                <h2 class="font-mafia text-2xl text-gray-200 uppercase tracking-widest mb-2 group-hover:text-[#d4af37] transition-colors">TD Dashboard</h2>
                <p class="text-gray-500 text-xs uppercase tracking-wider">Điều hành giải đấu</p>
            </a>

            <a href="./floor_ipad.html" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center group text-center cursor-pointer">
                <i class="fa-solid fa-tablet-screen-button text-5xl text-[#d4af37] mb-4 group-hover:scale-110 transition-transform"></i>
                <h2 class="font-mafia text-2xl text-gray-200 uppercase tracking-widest mb-2 group-hover:text-[#d4af37] transition-colors">Floor iPad</h2>
                <p class="text-gray-500 text-xs uppercase tracking-wider">Sơ đồ bàn & Nhân sự</p>
            </a>

            <a href="./god_mode.html" class="glass-panel border-[#800020]/40 hover:border-[#800020] rounded-2xl p-8 flex flex-col items-center justify-center group text-center cursor-pointer">
                <i class="fa-solid fa-chess-king text-5xl text-[#800020] mb-4 group-hover:scale-110 transition-transform"></i>
                <h2 class="font-mafia text-2xl text-gray-200 uppercase tracking-widest mb-2 group-hover:text-[#800020] transition-colors">God Mode</h2>
                <p class="text-gray-500 text-xs uppercase tracking-wider">Tổng quan Giám Đốc sòng</p>
            </a>

        </div>
    </main>

    <!-- STATUS FOOTER -->
    <footer class="absolute bottom-6 right-8 flex items-center space-x-3 bg-[#111] px-4 py-2 rounded-full border border-[#333] shadow-lg z-20" id="status-box">
        <div class="w-2.5 h-2.5 bg-gray-500 rounded-full" id="status-dot"></div>
        <span class="text-gray-400 font-bold text-[10px] tracking-widest uppercase" id="status-text">Đang kết nối...</span>
    </footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');
        const statusBox = document.getElementById('status-box');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        socket.on('connect', () => {
            statusBox.className = "absolute bottom-6 right-8 flex items-center space-x-3 bg-[#111] px-4 py-2 rounded-full border border-[#2ecc71]/40 shadow-lg z-20";
            statusDot.className = "w-2.5 h-2.5 bg-[#2ecc71] rounded-full pulse-dot";
            statusText.className = "text-[#2ecc71] font-bold text-[10px] tracking-widest uppercase";
            statusText.innerText = "Connected (Trạm Mây)";
        });

        socket.on('disconnect', () => {
            statusBox.className = "absolute bottom-6 right-8 flex items-center space-x-3 bg-[#111] px-4 py-2 rounded-full border border-red-500/40 shadow-lg z-20";
            statusDot.className = "w-2.5 h-2.5 bg-red-500 rounded-full";
            statusText.className = "text-red-500 font-bold text-[10px] tracking-widest uppercase";
            statusText.innerText = "Disconnected";
        });
    </script>
</body>
</html>
