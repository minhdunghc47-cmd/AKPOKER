<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker TMS 2.0 - HR Kiosk (Mafia Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111; color: #d1d5db; }
        .font-mafia { font-family: 'Playfair Display', serif; }
        .text-gold { color: #d4af37; }
        
        .panel-bg { background: #161616; border: 1px solid rgba(212, 175, 55, 0.2); }
        .card-mafia { background: #222; border: 1px solid #333; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .card-offline { cursor: pointer; border-left: 4px solid #555; }
        .card-offline:hover { background: #2a2a2a; border-left-color: #d4af37; }
        .card-waiting { cursor: default; border-left: 4px solid #d4af37; background: #1a1a1a; box-shadow: inset 0 0 10px rgba(212,175,55,0.1); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="flex-1 p-8 overflow-y-auto bg-[#0a0a0a] border-r border-[#d4af37]/30">
        <h2 class="text-2xl font-mafia text-gray-500 mb-2 tracking-widest uppercase text-center"><i class="fa-solid fa-user-clock mr-2"></i> CHƯA CHẤM CÔNG</h2>
        <div class="text-center text-[10px] text-gray-600 mb-8 uppercase tracking-[0.2em] font-bold">Chạm vào tên để Check-in</div>
        <div id="offline-list" class="flex flex-col gap-4 max-w-md mx-auto"></div>
    </div>
    
    <div class="flex-1 p-8 bg-[#161616] overflow-y-auto shadow-[-10px_0_20px_rgba(0,0,0,0.8)] z-10">
        <h2 class="text-2xl font-mafia text-gold mb-2 tracking-widest uppercase text-center drop-shadow-md"><i class="fa-solid fa-mug-hot mr-2"></i> KHO CHỜ VIỆC (STANDBY)</h2>
        <div class="text-center text-[10px] text-[#d4af37]/60 mb-8 uppercase tracking-[0.2em] font-bold">Sẵn sàng nhận lệnh từ Floor</div>
        <div id="waiting-list" class="flex flex-col gap-4 max-w-md mx-auto"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://akpoker.onrender.com');
        const offlineListDiv = document.getElementById('offline-list');
        const waitingListDiv = document.getElementById('waiting-list');

        function renderStaff(staffList) {
            offlineListDiv.innerHTML = '';
            waitingListDiv.innerHTML = '';

            staffList.forEach(staff => {
                const card = document.createElement('div');
                const isOffline = staff.status === 'offline';
                card.className = `card-mafia p-5 rounded-md flex justify-between items-center ${isOffline ? 'card-offline' : 'card-waiting'}`;
                
                card.innerHTML = `
                    <div>
                        <div class="text-lg font-bold text-gray-200 mb-1 tracking-wide">${staff.name}</div>
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${staff.role}</div>
                    </div>
                    <div>
                        ${isOffline ? '<i class="fa-solid fa-fingerprint text-2xl text-gray-600"></i>' : '<i class="fa-solid fa-check text-2xl text-[#d4af37]"></i>'}
                    </div>
                `;
                
                if (isOffline) {
                    card.onclick = () => socket.emit('staff_checkin', staff.id);
                    offlineListDiv.appendChild(card);
                } else if (staff.status === 'waiting') {
                    waitingListDiv.appendChild(card);
                }
            });
        }

        socket.on('update_staff_list', (staffList) => renderStaff(staffList));
    </script>
</body>
</html>
